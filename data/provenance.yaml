checked:
  note: scripts/02_verify.py, with DuckDB and readers of its own for DBF, SHP and WKB, before upload
  items:
    - zips against MANIFEST.json (bytes, sha256) and zipfile.testzip
    - theme zips hold byte-identical (CRC) copies of the all-layers zip's layer files
    - rows equal the DBF header and the .shp record count, and the pinned counts
    - every attribute value equals the DBF text (trimmed, integers parsed), 1,176,455 values
    - every geometry has its .shp record's x and y in order, 2,999,080 points; empty shapes are NULL
    - the dropped M values were only 0 or the Shapefile no-data value
    - every column of the type its name gives
    - GeoParquet 1.0.0 metadata states the CRS the .prj names
    - a DuckDB without the spatial extension opens every file
    - no bloom filters
    - polbnda 2.2 differs from 2.1 in exactly 5 rows (fid 52, 53, 54, 403, 2110), geometry identical

modifications:
  raw: none. GSI's zips, byte for byte.
  parquet:
    - one GeoParquet 1.0.0 per vector layer and version, read with GDAL (DuckDB spatial ST_Read)
    - columns typed by name (pop, ypc and the Global Map codes INTEGER, the rest text); a value that does not fit stops the build
    - text trimmed of surrounding spaces as GDAL reads it (one value loses a leading space, polbnda laa " Ogasawara Mura")
    - fid added, the record's position in the Shapefile from 0; rows in that order
    - M values dropped (only 0 or no-data); x and y unchanged
    - no reprojection; CRS as the .prj names it
    - written with zstd, without bloom filters
  rasters: not converted
