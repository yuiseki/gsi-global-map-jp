    unchanged); gm-jpn-trans_u_2_2.zip in May 2017 (roadl_jpn.*, its .prj now
    JGD2000). The 2.1 zips were not corrected. Earlier copies are not
    available. The theme zips of each vector version hold byte-identical
    copies of the all-layers zip's layer files; the Parquet is made from the
    all-layers zip. Rasters are published as zips only.
